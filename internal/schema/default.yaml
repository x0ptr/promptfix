# promptfix configuration
#
# default_schema: schema used by `promptfix new` without --schema.
# editor:         command for ctrl+e (falls back to $VISUAL, $EDITOR, vi/notepad).
# history.keep:   0 = keep all versions; N > 0 = keep the newest N per prompt.
# schemas:        a schema named "default" replaces the built-in one;
#                 other names add new schemas.
#
# Section fields: tag (required, ^[a-z_][a-z0-9_-]*$), title, help, example, required.

default_schema: default
editor: ""
history:
  keep: 0
schemas:
  - name: default
    sections:
      - tag: product
        title: Product
        help: Short description of the product.
        example: Kurzbeschreibung
        required: true
      - tag: glossar
        title: Glossary
        help: Definitions of domain terms.
        example: Klärung Begriffe
      - tag: technik
        title: Technology
        help: Language and version, frameworks, databases, authentication.
        example: |
          Programmiersprache + Version,
          Frameworks,
          Datenbanken mit plugin,
          Anmeldung über X (bspw: Entra ID),
          je X ein Y
      - tag: querschnitt
        title: Cross-cutting concerns
        help: Tenancy, permissions, data protection.
        example: Mandanten, Rechte, Datenschutz
      - tag: abweichungen
        title: Deviations
        help: Deliberate deviations from the usual approach, each with a reason.
        example: |
          - der x_id wird ausschliesslich aus dem Token abgeleitet,
            nie aus Parametern der Anfrage, Grund: "Parameter sind manipulierbar"
          - RLS, Tenant Trennung über DB erzwungen
      - tag: nicht_ziele
        title: Non-goals
        help: What is explicitly out of scope.
        example: Kein Abruf aus Sharepoint
      - tag: aufgabe
        title: Task
        help: The work package to do now.
        example: "AP1 Fundament: Datenmodell, Trennung nach Tenant, Rollen und Rechte"
        required: true
      - tag: abnahme
        title: Acceptance
        help: Verifiable acceptance criteria.
        example: A1 Nutzer aus Tenant A fragt ein Dokument aus Tenant B per ID ab -> 404, kein Hinweis, dass die Akte existiert
      - tag: arbeitsweise
        title: Way of working
        help: How the result should be delivered.
        example: |
          Schreibe noch kein Code. Liefere zuerst:
            1. Alle xy
            2. offene Fragen, nach Risiko sortiert
        required: true
