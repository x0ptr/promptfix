# promptfix configuration
#
# default_schema: schema used by `promptfix new` without --schema.
# editor:         command for ctrl+e (falls back to $VISUAL, $EDITOR, vi/notepad).
# history.keep:   0 = keep all versions; N > 0 = keep the newest N per prompt.
# schemas:        a schema named "default" replaces the built-in one;
#                 other names add new schemas.
#
# Section fields: tag (required, ^[a-z_][a-z0-9_-]*$), title, help, example, required.

default_schema: default
editor: ""
history:
  keep: 0
schemas:
  - name: default
    sections:
      - tag: product
        title: Product
        help: Short description of the product.
        example: A CLI tool that guides the user step by step through building a structured prompt.
        required: true
      - tag: glossary
        title: Glossary
        help: Definitions of domain terms.
        example: "Tenant: an organization with its own isolated data"
      - tag: technology
        title: Technology
        help: Language and version, frameworks, databases, authentication.
        example: |
          Language + version,
          frameworks,
          databases with plugins,
          sign-in via X (e.g. Entra ID),
          one Y per X
      - tag: cross_cutting
        title: Cross-cutting concerns
        help: Tenancy, permissions, data protection.
        example: Tenancy, permissions, data protection
      - tag: deviations
        title: Deviations
        help: Deliberate deviations from the usual approach, each with a reason.
        example: |
          - tenant_id is derived from the token only,
            never from request parameters. Reason: "parameters can be tampered with"
          - row-level security: tenant separation is enforced by the database
      - tag: non_goals
        title: Non-goals
        help: What is explicitly out of scope.
        example: No import from SharePoint
      - tag: task
        title: Task
        help: The work package to do now.
        example: "WP1 Foundation: data model, tenant separation, roles and permissions"
        required: true
      - tag: acceptance
        title: Acceptance
        help: Verifiable acceptance criteria.
        example: A1 A user of tenant A requests a document of tenant B by ID -> 404, no hint that the document exists
      - tag: way_of_working
        title: Way of working
        help: How the result should be delivered.
        example: |
          Do not write code yet. First deliver:
            1. all ...
            2. open questions, sorted by risk
        required: true
